version: "v0.4"

project:
  name: "Graph isomorphism in quasipolynomial time"
  description: >-
    A Lean 4 proof that a deterministic algorithm decides isomorphism of graphs with n vertices
    and maximum degree d in time n^O(log d), and so graph isomorphism in time n^O(log n). The
    statement is about Mathlib's multitape Turing machines (Turing.FinTM2), and time is the
    number of steps. The proof gives one Turing machine and one constant C such that for all
    graphs G and H on n vertices in which every vertex has at most d neighbours, the machine,
    started on the adjacency matrices of G and H as bits, halts with a correct answer within
    exp(C * log(n + 2) * log(d + 2)) steps. The machine is not given d. Taking d = n gives the
    bound exp(C * (log(n + 2))^2) for all graphs. If G and H are isomorphic, the answer includes
    one isomorphism and generators of the automorphism group of G. The three cited results that
    rest on the classification of finite simple groups (the classification, Schreier's
    conjecture for the groups on the list, and Maróti's bound on the orders of primitive groups)
    are proved with AxiomMath/CFSG and MarotiOrdersOfPrimitiveGroups.
  authors: ["Mahdi JafariRaviz"]
  responsible_maintainers: ["Mahdi JafariRaviz"]
  license: "Apache-2.0"

sources:
  - title: "Deterministic n^{O(log n)} Graph Isomorphism Algorithm via Inherited Decompositions"
    authors: ["MohammadTaghi Hajiaghayi", "Mahdi JafariRaviz"]
    id: "arXiv:2611.01399"
    type: "article"
    location: "Theorem 1.1 and Corollary 1.2"
    relationship: "formalizes"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/AxiomMath/CFSG"
    relationship: "builds-on"
    note: >-
      The proofs of the classification of finite simple groups and of Schreier's conjecture for
      the groups on the list. Eight files of the library are adapted from it (see
      THIRD_PARTY_NOTICES.txt).
  - id: "https://github.com/mahdi-jfri/MarotiOrdersOfPrimitiveGroups"
    relationship: "builds-on"
    note: "The proof of Theorem 1.1 of A. Maróti, On the orders of primitive groups (2002)."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "builds-on"
    note: "The statement of the classification and the list of finite simple groups."

