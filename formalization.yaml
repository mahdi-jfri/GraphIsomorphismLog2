fidelity:
  divergences: >-
    The paper does not fix a machine model. The Lean statement fixes one: Mathlib's multitape
    Turing machines (Workspace/Statement/Turing.lean), with time the number of steps. The proof
    first runs the algorithm on a log-cost RAM with procedure calls
    (Workspace/Statement/Machine.lean), where every operation costs one plus the number of binary
    digits of each number it reads or writes, and then simulates that machine on Turing machines
    with a polynomial slowdown. The time bounds and the output are those of the paper's
    Theorem 1.1 and Corollary 1.2. Some steps of the proof differ from
    the paper without changing the statement. For example, Bochert's bound replaces Maróti's
    bound in Lemmas A.12 and A.24, and Theorem A.20 uses Dixon's derived length bound with the
    constant 5 in place of 5/2, which changes only constants inside the proof. In the proof of
    Theorem 1.1, the structure theorem for primitive groups with restricted composition factors
    and the recognition of Johnson actions, which the paper cites from Grohe, Neuen and
    Schweitzer, are proved in the library.

review:
